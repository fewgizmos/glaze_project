name: "[Action] Nightly"

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  glaze_build_id: public_test
  glaze_bin_name: glazetest
  RELEASE_TAG: action-nightly
  RELEASE_TITLE: "[Action] Nightly"

jobs:
  build-linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        run: bash scripts/prepare_env_lin.sh

      - name: Build debug
        run: bash scripts/builder_lin.sh -d

      - name: Build release
        run: bash scripts/builder_lin.sh

      - name: Package
        run: |
          stage_common() {
              mkdir -p "$1/source" "$1/docs/readme"
              cp -r source/glaze_project_resources "$1/source/"
              cp README.md "$1/"
              cp -r docs/readme/assets "$1/docs/readme/"
          }

          public="$RUNNER_TEMP/public_test_lin_gl"
          stage_common "$public"
          cp "build/$glaze_build_id/linux/release/$glaze_bin_name" "$public/"
          (cd "$public" && zip -r -q "$GITHUB_WORKSPACE/public_test_lin_gl.zip" .)

          internal="$RUNNER_TEMP/internal_test_lin_gl"
          stage_common "$internal"
          cp "build/$glaze_build_id/linux/debug/$glaze_bin_name" "$internal/"
          cp "build/$glaze_build_id/linux/release/$glaze_bin_name" "$internal/${glaze_bin_name}_release"
          (cd "$internal" && zip -r -q "$GITHUB_WORKSPACE/internal_test_lin_gl.zip" .)

          cp "build/$glaze_build_id/linux/debug/$glaze_bin_name" "${glaze_bin_name}_debug_lin"
          cp "build/$glaze_build_id/linux/release/$glaze_bin_name" "${glaze_bin_name}_release_lin"

          zip -r -q resources.zip source/glaze_project_resources

      - uses: actions/upload-artifact@v7
        with:
          name: test_lin_gl
          path: |
            public_test_lin_gl.zip
            internal_test_lin_gl.zip
            ${{ env.glaze_bin_name }}_debug_lin
            ${{ env.glaze_bin_name }}_release_lin
            resources.zip
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        shell: pwsh
        run: ./scripts/prepare_env_win.ps1

      - name: Build debug
        shell: pwsh
        run: ./scripts/builder_win.ps1 -d

      - name: Build release
        shell: pwsh
        run: ./scripts/builder_win.ps1

      - name: Package
        shell: pwsh
        run: |
          function Stage-Common($stage) {
              New-Item -ItemType Directory -Force -Path "$stage/source", "$stage/docs/readme" | Out-Null
              Copy-Item source/glaze_project_resources "$stage/source/" -Recurse
              Copy-Item README.md $stage
              Copy-Item docs/readme/assets "$stage/docs/readme/" -Recurse
          }

          $public = "$env:RUNNER_TEMP/public_test_win_gl"
          Stage-Common $public
          Copy-Item "build/$env:glaze_build_id/windows/release/*" $public -Recurse
          Compress-Archive -Path "$public/*" -DestinationPath public_test_win_gl.zip -Force

          $internal = "$env:RUNNER_TEMP/internal_test_win_gl"
          Stage-Common $internal
          Copy-Item "build/$env:glaze_build_id/windows/debug/*" $internal -Recurse
          Copy-Item "build/$env:glaze_build_id/windows/release/*.dll" $internal -Force
          Copy-Item "build/$env:glaze_build_id/windows/release/$env:glaze_bin_name.exe" "$internal/$($env:glaze_bin_name)_release.exe"
          Compress-Archive -Path "$internal/*" -DestinationPath internal_test_win_gl.zip -Force

          Copy-Item "build/$env:glaze_build_id/windows/debug/$env:glaze_bin_name.exe" "$($env:glaze_bin_name)_debug_win.exe"
          Copy-Item "build/$env:glaze_build_id/windows/release/$env:glaze_bin_name.exe" "$($env:glaze_bin_name)_release_win.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: test_win_gl
          path: |
            public_test_win_gl.zip
            internal_test_win_gl.zip
            ${{ env.glaze_bin_name }}_debug_win.exe
            ${{ env.glaze_bin_name }}_release_win.exe
          retention-days: 1

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Delete previous nightly
        run: |
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true

      - name: Publish nightly
        run: |
          gh release create "$RELEASE_TAG" \
            public_test_lin_gl.zip public_test_win_gl.zip \
            internal_test_lin_gl.zip internal_test_win_gl.zip \
            "${glaze_bin_name}_debug_lin" "${glaze_bin_name}_debug_win.exe" \
            "${glaze_bin_name}_release_lin" "${glaze_bin_name}_release_win.exe" \
            resources.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Debug and release builds of ${GITHUB_SHA::7}" \
            --prerelease
