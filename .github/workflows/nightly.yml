name: "[Action] Nightly"

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  glaze_build_id: dev
  glaze_bin_name: glaze_game
  rt_glaze_window_name: "glaze game"
  rt_glaze_window_logo: "source/glaze_project_resources/textures/logo.png"
  RELEASE_TAG: action-nightly
  RELEASE_TITLE: "[Action] Nightly"

jobs:
  build-linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        run: bash scripts/prepare_env_lin.sh

      - name: Build release
        run: bash scripts/builder_lin.sh

      - name: Stash release binary
        run: cp "build/$glaze_build_id/linux/release/$glaze_bin_name" "$RUNNER_TEMP/${glaze_bin_name}_lin"

      - name: Build dev
        run: bash scripts/builder_lin.sh -i

      - name: Stash dev binary
        run: cp "build/$glaze_build_id/linux/release/$glaze_bin_name" "$RUNNER_TEMP/${glaze_bin_name}_internal_lin"

      - name: Package
        run: |
          stage_common() {
              mkdir -p "$1/source" "$1/docs/readme"
              cp -r source/glaze_project_resources "$1/source/"
              cp README.md "$1/"
              cp -r docs/readme/assets "$1/docs/readme/"
          }

          public="$RUNNER_TEMP/${glaze_bin_name}_public_lin_gl"
          stage_common "$public"
          cp "$RUNNER_TEMP/${glaze_bin_name}_lin" "$public/${glaze_bin_name}_lin"
          (cd "$public" && zip -r -q "$GITHUB_WORKSPACE/${glaze_bin_name}_public_lin_gl.zip" .)

          internal="$RUNNER_TEMP/${glaze_bin_name}_internal_lin_gl"
          stage_common "$internal"
          cp "$RUNNER_TEMP/${glaze_bin_name}_internal_lin" "$internal/${glaze_bin_name}_internal_lin"
          (cd "$internal" && zip -r -q "$GITHUB_WORKSPACE/${glaze_bin_name}_internal_lin_gl.zip" .)

          cp "$RUNNER_TEMP/${glaze_bin_name}_lin" "${glaze_bin_name}_lin"
          cp "$RUNNER_TEMP/${glaze_bin_name}_internal_lin" "${glaze_bin_name}_internal_lin"

          zip -r -q resources.zip source/glaze_project_resources

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.glaze_bin_name }}_lin_gl
          path: |
            ${{ env.glaze_bin_name }}_public_lin_gl.zip
            ${{ env.glaze_bin_name }}_internal_lin_gl.zip
            ${{ env.glaze_bin_name }}_lin
            ${{ env.glaze_bin_name }}_internal_lin
            resources.zip
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        shell: pwsh
        run: ./scripts/prepare_env_win.ps1

      - name: Build release
        shell: pwsh
        run: ./scripts/builder_win.ps1

      - name: Stash release build
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/win_release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/$env:glaze_build_id/windows/release/*" $stage -Recurse -Force
          Rename-Item "$stage/$env:glaze_bin_name.exe" "$($env:glaze_bin_name)_win.exe"

      - name: Build dev
        shell: pwsh
        run: ./scripts/builder_win.ps1 -i

      - name: Stash dev build
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/win_dev"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/$env:glaze_build_id/windows/release/*" $stage -Recurse -Force
          Rename-Item "$stage/$env:glaze_bin_name.exe" "$($env:glaze_bin_name)_internal_win.exe"

      - name: Package
        shell: pwsh
        run: |
          function Stage-Common($stage) {
              New-Item -ItemType Directory -Force -Path "$stage/source", "$stage/docs/readme" | Out-Null
              Copy-Item source/glaze_project_resources "$stage/source/" -Recurse
              Copy-Item README.md $stage
              Copy-Item docs/readme/assets "$stage/docs/readme/" -Recurse
          }

          $public = "$env:RUNNER_TEMP/$($env:glaze_bin_name)_public_win_gl"
          Stage-Common $public
          Copy-Item "$env:RUNNER_TEMP/win_release/*" $public -Recurse -Force
          Compress-Archive -Path "$public/*" -DestinationPath "$($env:glaze_bin_name)_public_win_gl.zip" -Force

          $internal = "$env:RUNNER_TEMP/$($env:glaze_bin_name)_internal_win_gl"
          Stage-Common $internal
          Copy-Item "$env:RUNNER_TEMP/win_dev/*" $internal -Recurse -Force
          Compress-Archive -Path "$internal/*" -DestinationPath "$($env:glaze_bin_name)_internal_win_gl.zip" -Force

          Copy-Item "$env:RUNNER_TEMP/win_release/$($env:glaze_bin_name)_win.exe" "$($env:glaze_bin_name)_win.exe"
          Copy-Item "$env:RUNNER_TEMP/win_dev/$($env:glaze_bin_name)_internal_win.exe" "$($env:glaze_bin_name)_internal_win.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.glaze_bin_name }}_win_gl
          path: |
            ${{ env.glaze_bin_name }}_public_win_gl.zip
            ${{ env.glaze_bin_name }}_internal_win_gl.zip
            ${{ env.glaze_bin_name }}_win.exe
            ${{ env.glaze_bin_name }}_internal_win.exe
          retention-days: 1

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Delete previous nightly
        run: |
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true

      - name: Publish nightly
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Release and dev builds of ${GITHUB_SHA::7}" \
            --prerelease

          assets=(
            ${{ env.glaze_bin_name }}_internal_lin_gl.zip
            ${{ env.glaze_bin_name }}_internal_win_gl.zip
            ${{ env.glaze_bin_name }}_public_lin_gl.zip
            ${{ env.glaze_bin_name }}_public_win_gl.zip
            "${glaze_bin_name}_internal_lin"
            "${glaze_bin_name}_internal_win.exe"
            "${glaze_bin_name}_lin"
            "${glaze_bin_name}_win.exe"
            resources.zip
          )

          for asset in "${assets[@]}"; do
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done
